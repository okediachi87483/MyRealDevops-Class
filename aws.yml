---
- hosts: "{{ host }}"
  gather_facts: true
  vars:
    access_key: xx
    secret_key: xx
  tasks:
    - name: Provision instance
      amazon.aws.ec2_instance:
        aws_access_key: "{{ access_key}}"
        aws_secret_key: "{{ secret_key }}"
        key_name: "{{ pem_key }}"
        instance_type: t3.micro
        image_id: ami-020ba0ae8c230ae28
        wait: yes
        count: 1
        region: us-east-2
        tags:
          Name: test-ec2